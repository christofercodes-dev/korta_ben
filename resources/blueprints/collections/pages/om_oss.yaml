title: 'om oss'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Titel
              required: true
              validate:
                - required
      -
        display: 'om oss'
        fields:
          -
            handle: small_title
            field:
              type: text
              display: 'Liten rubrik'
          -
            handle: big_title
            field:
              type: text
              display: 'Stor rubrik'
              validate:
                - required
          -
            handle: content
            field:
              type: textarea
              display: Text
          -
            handle: about_title
            field:
              type: text
              display: 'Rubrik (om oss)'
          -
            handle: about_content
            field:
              type: textarea
              display: 'Text (om oss)'
      -
        display: 'Vi som jobbar här'
        fields:
          -
            handle: team
            field:
              type: replicator
              display: Team
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    person:
                      display: Person
                      fields:
                        -
                          handle: name
                          field:
                            type: text
                            display: Namn
                        -
                          handle: role
                          field:
                            type: text
                            display: Roll
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
