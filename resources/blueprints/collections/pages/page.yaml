title: Startsida
tabs:
  main:
    display: Startsida
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Titel
              required: true
              validate:
                - required
      -
        display: Hero
        fields:
          -
            handle: hero_title
            field:
              type: text
              display: Rubrik
              instructions: 'Första textraden.'
          -
            handle: hero_title_italic
            field:
              type: text
              display: Rubrik (kursiv)
              instructions: 'Kursiv text på andra raden.'
          -
            handle: hero_subtitle
            field:
              type: text
              display: Underrubrik
          -
            handle: hero_image_1
            field:
              type: assets
              container: assets
              display: 'Hero-bild 1'
              instructions: 'Bilden som visas till vänster på startsidan.'
              max_files: 1
              min_files: 1
              mode: grid
          -
            handle: hero_image_2
            field:
              type: assets
              container: assets
              display: 'Hero-bild 2'
              instructions: 'Bilden som visas till höger på startsidan.'
              max_files: 1
              min_files: 1
              mode: grid
      -
        display: 'Utvalda projekt'
        fields:
          -
            handle: featured_projects
            field:
              type: entries
              collections:
                - projects
              display: 'Utvalda projekt'
              instructions: 'Välj vilka projekt som visas på startsidan. Bild och hover-bild hämtas från projektet. Dra för att ändra ordning.'
              max_items: 4
              create: false
              mode: stack
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              display: Slug
              localizable: true
              validate: 'max:200'

