title: Startsida
tabs:
  main:
    display: Startsida
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Titel
              required: true
              validate:
                - required
      -
        display: Hero
        fields:
          -
            handle: hero_title
            field:
              type: text
              display: Rubrik
              instructions: 'Första textraden.'
          -
            handle: hero_title_italic
            field:
              type: text
              display: Rubrik (kursiv)
              instructions: 'Kursiv text på andra raden.'
          -
            handle: hero_subtitle
            field:
              type: text
              display: Underrubrik
          -
            handle: hero_image_1
            field:
              type: assets
              container: assets
              display: 'Hero-bild 1'
              instructions: 'Bilden som visas till vänster på startsidan.'
              max_files: 1
              min_files: 1
              mode: grid
          -
            handle: hero_image_2
            field:
              type: assets
              container: assets
              display: 'Hero-bild 2'
              instructions: 'Bilden som visas till höger på startsidan.'
              max_files: 1
              min_files: 1
              mode: grid
      -
        display: 'Om oss-sektionen'
        fields:
          -
            handle: about_title
            field:
              type: text
              display: Rubrik
              placeholder: 'Vad sysslar vi med?'
          -
            handle: about_text_1
            field:
              type: textarea
              display: 'Stycke 1'
              rows: 3
          -
            handle: about_text_2
            field:
              type: textarea
              display: 'Stycke 2'
              rows: 3
          -
            handle: about_button_text
            field:
              type: text
              display: Knapptext
              placeholder: 'Prata med oss'
          -
            handle: about_button_link
            field:
              type: text
              display: Knappens länk
              placeholder: /kontakt
      -
        display: Påstående
        fields:
          -
            handle: statement_text
            field:
              type: textarea
              display: Text
              instructions: 'Stor text mellan bandet och projekten. Håll den till en eller två meningar.'
              rows: 3
              placeholder: 'Vi är en kreativ byrå som gillar bra idéer, enkelt språk och saker som känns på riktigt.'
      -
        display: 'Utvalda projekt'
        fields:
          -
            handle: projects_label
            field:
              type: text
              display: Etikett
              placeholder: 'Utvalda projekt'
          -
            handle: projects_title
            field:
              type: text
              display: Rubrik
              placeholder: 'Några projekt vi är stolta över.'
          -
            handle: projects_button_text
            field:
              type: text
              display: 'Knapptext (under projekten)'
              placeholder: 'Se fler projekt'
          -
            handle: featured_projects
            field:
              type: entries
              collections:
                - projects
              display: 'Utvalda projekt'
              instructions: 'Välj vilka projekt som visas på startsidan. Bild och hover-bild hämtas från projektet. Dra för att ändra ordning.'
              max_items: 4
              create: false
              mode: stack
  sidebar:
    display: Sidebar
    sections:
      -
        display: SEO
        fields:
          -
            import: seo
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              display: Slug
              localizable: true
              validate: 'max:200'

