title: Kontakt
tabs:
  main:
    display: Kontakt
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Titel
              required: true
              validate:
                - required

          -
            handle: big_title
            field:
              type: text
              display: Stor rubrik
          -
            handle: content
            field:
              type: textarea
              display: Text
  sidebar:
    display: Sidebar
    sections:
      -
        display: SEO
        fields:
          -
            import: seo
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              display: Slug
              localizable: true
              validate: 'max:200'

