      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: template
            field:
              type: template
              display: Template
          -
            handle: author
            field:
              type: users
              display: Author
      -
        display: kontakt
        fields:
          -
            handle: big_title
            field:
              type: text
              display: Titel
          -
            handle: content
            field:
              type: textarea
              display: content
          -
            handle: email
            field:
              type: text
              display: email
          -
            handle: phone
            field:
              type: text
              display: phone
          -
            handle: adress
            field:
              type: text
              display: adress
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
