title: Project
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: content
            field:
              type: markdown
              display: Content
              localizable: true
              escape_markup: true
          -
            handle: author
            field:
              type: users
              display: Author
              default: current
              localizable: true
              max_items: 1
          -
            handle: template
            field:
              type: template
              display: Template
              localizable: true
          -
            handle: image_hover
            field:
              container: assets
              type: assets
              display: 'image hover'
      -
        display: Projects
        fields:
          -
            handle: select_field
            field:
              options:
                - key: foto
                  value: Foto
                - key: video
                  value: Video
                - key: campaign
                  value: Campaign
                - key: web
                  value: Webb
              type: select
              display: 'Select Field'
          -
            handle: description
            field:
              type: textarea
              display: description
          -
            handle: image
            field:
              container: assets
              type: assets
              display: image
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
