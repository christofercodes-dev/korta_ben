title: Projekt
tabs:
  main:
    display: Projekt
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Titel
              required: true
              validate:
                - required
          -
            handle: category
            field:
              type: select
              display: Kategori
              instructions: 'Visas ovanför projektnamnet.'
              options:
                - key: foto
                  value: Foto
                - key: video
                  value: Video
                - key: campaign
                  value: Campaign
                - key: web
                  value: Webb
              validate:
                - required
          -
            handle: image
            field:
              type: assets
              container: assets
              display: Omslagsbild
              instructions: 'Visas i projektlistan och på startsidan.'
              max_files: 1
              min_files: 1
              mode: grid
              validate:
                - required
          -
            handle: image_hover
            field:
              type: assets
              container: assets
              display: Hover-bild
              instructions: 'Valfri. Tonas in när man håller muspekaren över omslagsbilden.'
              max_files: 1
              mode: grid
          -
            handle: description
            field:
              type: textarea
              display: 'Kort beskrivning'
              instructions: 'Valfri. Visas under rubriken på projektsidan och används som beskrivning i sökmotorer.'
              character_limit: 300
  innehall:
    display: Innehåll
    sections:
      -
        fields:
          -
            handle: project_content
            field:
              type: replicator
              display: Innehåll
              instructions: 'Bygg projektsidan genom att lägga till block i den ordning de ska visas.'
              button_label: 'Lägg till block'
              sets:
                blocks:
                  display: Block
                  sets:
                    text:
                      display: Text
                      icon: text
                      fields:
                        -
                          handle: heading
                          field:
                            type: text
                            display: Rubrik
                        -
                          handle: body
                          field:
                            type: bard
                            display: Text
                            remove_empty_nodes: false
                            buttons:
                              - h2
                              - h3
                              - unorderedlist
                              - orderedlist
                              - bold
                              - italic
                              - link
                              - quote
                              - removeformat
                    images:
                      display: Bilder
                      icon: image
                      instructions: 'Välj 1–3 bilder. En bild visas stor, två eller tre visas bredvid varandra.'
                      fields:
                        -
                          handle: images
                          field:
                            type: assets
                            container: assets
                            display: Bilder
                            mode: grid
                            min_files: 1
                            max_files: 3
                            validate:
                              - required
                    image_text:
                      display: 'Bild + text'
                      icon: layout-split
                      fields:
                        -
                          handle: image
                          field:
                            type: assets
                            container: assets
                            display: Bild
                            mode: grid
                            min_files: 1
                            max_files: 1
                        -
                          handle: heading
                          field:
                            type: text
                            display: Rubrik
                        -
                          handle: body
                          field:
                            type: bard
                            display: Text
                            remove_empty_nodes: false
                            buttons:
                              - h2
                              - h3
                              - unorderedlist
                              - orderedlist
                              - bold
                              - italic
                              - link
                              - quote
                              - removeformat
                    video:
                      display: Video
                      icon: video
                      instructions: 'Klistra in en länk till YouTube, Vimeo eller en .mp4-fil.'
                      fields:
                        -
                          handle: video
                          field:
                            type: video
                            display: Videolänk
                            validate:
                              - required
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              display: Slug
              localizable: true
              validate: 'max:200'
