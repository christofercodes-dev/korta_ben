title: Företagsinfo
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: email
            field:
              type: text
              input_type: email
              display: E-post
          -
            handle: phone
            field:
              type: text
              display: Telefon
              instructions: 'Visas som du skriver det, t.ex. +46 70 123 45 67.'
          -
            handle: phone_link
            field:
              type: text
              display: 'Telefon (för länk)'
              instructions: 'Samma nummer utan mellanslag, t.ex. +46701234567.'
          -
            handle: address
            field:
              type: textarea
              display: Adress
          -
            handle: instagram
            field:
              type: text
              input_type: url
              display: Instagram-länk
  contact:
    display: Kontaktperson
    sections:
      -
        instructions: 'Visas på kontaktsidan. Lämnar du fälten tomma används företagets e-post och telefon.'
        fields:
          -
            handle: contact_name
            field:
              type: text
              display: Namn
          -
            handle: contact_email
            field:
              type: text
              input_type: email
              display: E-post
          -
            handle: contact_phone
            field:
              type: text
              display: Telefon
          -
            handle: contact_phone_link
            field:
              type: text
              display: 'Telefon (för länk)'
              instructions: 'Samma nummer utan mellanslag, t.ex. +46768519560.'
          -
            handle: contact_image
            field:
              type: assets
              container: assets
              display: Porträtt
              max_files: 1
              min_files: 0
              mode: grid
