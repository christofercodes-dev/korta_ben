<section id="hero" class="relative bg-white text-[#181818]">

    <div id="hero-scroll" class="relative h-[180vh]">

        <div class="sticky top-0 h-screen overflow-hidden">

            <!-- ==================================================
     TITLE
================================================== -->
            <div id="hero-title"
                class="hero-intro-title absolute left-5 top-55 z-10 origin-top-left md:left-30 md:top-62">
                <h1
                    class="max-w-[90vw] text-[11vw] font-light leading-[0.9] tracking-[-0.06em] md:max-w-[1200px] md:text-[5.5vw] md:leading-[0.93] md:tracking-[-0.065em]">
                    <span class="hero-line hero-line-1">
                        {{ hero_title }}
                    </span>

                    <span class="hero-line hero-line-2 font-serif italic font-normal text-black/45">
                        {{ hero_title_italic }}
                    </span>

                    <br>

                    <span class="hero-line hero-line-3">
                        {{ hero_subtitle }}
                    </span>
                </h1>
            </div>


            <!-- ==================================================
                 IMAGE GRID
            ================================================== -->

            <div id="hero-images"
                class="absolute bottom-10 left-5 right-5 z-10 grid grid-cols-1 gap-2 sm:bottom-0 sm:grid-cols-2 md:left-8 md:right-8 md:gap-3">


                <!-- ==================================================
                     HERO CARD 01
                ================================================== -->

                <a href="#work" class="hero-card group relative hidden overflow-hidden sm:block">

                    <div class="hero-image relative aspect-[1.15] h-full w-full overflow-hidden bg-[#e8e6e1]">

                        {{ hero_image_1 }}

                        <img src="{{ url }}" alt="{{ alt }}" class="h-full w-full object-cover">

                        {{ /hero_image_1 }}


                        <!-- OVERLAY -->

                        <div
                            class="hero-overlay absolute inset-0 flex flex-col justify-between bg-black/0 p-5 text-white opacity-0 backdrop-blur-0 transition-all duration-700 ease-[cubic-bezier(.16,1,.3,1)] md:p-7">


                            <!-- CENTER -->

                            <div
                                class="mt-auto max-w-[500px] translate-y-4 transition-transform duration-700 ease-[cubic-bezier(.16,1,.3,1)] group-hover:translate-y-0">

                                <h2
                                    class="text-[7vw] font-medium uppercase leading-[0.85] tracking-[-0.045em] md:text-[4vw]">
                                    {{ hero_image_1_title}}
                                </h2>

                                <p class="mt-5 max-w-[340px] text-[11px] leading-[1.6] text-white/65 md:text-[13px]">
                                    {{hero_label_1}}
                                </p>

                            </div>



                        </div>

                    </div>

                </a>



                <!-- ==================================================
                     HERO CARD 02
                ================================================== -->

                <a href="#work" class="hero-card group relative block overflow-hidden">

                    <div class="hero-image relative aspect-[1.15] h-full w-full overflow-hidden bg-[#e8e6e1]">

                        {{ hero_image_2 }}

                        <img src="{{ url }}" alt="{{ alt }}" class="h-full w-full object-cover">

                        {{ /hero_image_2 }}


                        <!-- OVERLAY -->

                        <div
                            class="hero-overlay absolute inset-0 flex flex-col justify-between bg-black/0 p-5 text-white opacity-0 backdrop-blur-0 transition-all duration-700 ease-[cubic-bezier(.16,1,.3,1)] md:p-7">




                            <!-- CENTER -->

                            <div
                                class="mt-auto max-w-[500px] translate-y-4 transition-transform duration-700 ease-[cubic-bezier(.16,1,.3,1)] group-hover:translate-y-0">

                                <h2
                                    class="text-[7vw] font-medium uppercase leading-[0.85] tracking-[-0.045em] md:text-[4vw]">
                                    {{ hero_image_2_title }}
                                </h2>

                                <p class="mt-5 max-w-[340px] text-[11px] leading-[1.6] text-white/65 md:text-[13px]">
                                    {{ hero_label_2 }}
                                </p>

                            </div>



                        </div>

                    </div>

                </a>

            </div>


            <!-- ==================================================
                 CASE LABELS
            ================================================== -->

            <div id="hero-meta" class="absolute bottom-5 left-5 right-5 z-20 flex justify-between md:left-8 md:right-8">





            </div>

        </div>

    </div>

</section>


<!-- ==================================================
     HERO HOVER
================================================== -->

<style>
    @media (min-width: 768px) {

        .hero-card {
            position: relative;
        }

        .hero-image {
            position: relative;
        }


        /* ================================
           OVERLAY
        ================================= */

        .hero-card:hover .hero-overlay {

            opacity: 1;

            background:
                linear-gradient(to top,
                    rgba(0, 0, 0, 0.78),
                    rgba(0, 0, 0, 0.28) 55%,
                    rgba(0, 0, 0, 0.08));

            backdrop-filter: blur(2px);
        }


        /* ================================
           IMAGE
        ================================= */

        .hero-card img {

            transition:
                transform 1200ms cubic-bezier(.16, 1, .3, 1);

        }

        .hero-card:hover img {

            transform: scale(1.025);

        }

    }


    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 767px) {

        .hero-overlay {
            display: none;
        }

        .hero-card img {
            transition: transform 800ms cubic-bezier(.16, 1, .3, 1);
        }

        .hero-card:active img {
            transform: scale(1.02);
        }

    }
</style>
