<footer id="contact" class="border-t border-white/10 bg-[#181818] px-5 py-16 text-[#eeece7] md:px-8 md:py-20">


    <div class="grid gap-12 border-b border-white/10 pb-16 md:grid-cols-12 md:gap-6">


        <!-- BRAND -->

        <div class="md:col-span-5">

            <img
            src="/images/logos/logo-symbol.svg"
            alt="Korta ben"
            class="h-8 w-auto brightness-0 invert"
        >

            <address class="mt-5 max-w-[280px] whitespace-pre-line text-[12px] not-italic leading-[1.7] text-white/50">{{ company:address }}</address>

        </div>


        <!-- NAVIGATION -->

        <div class="md:col-span-2">

            <p class="mb-5 text-[8px] uppercase tracking-[0.25em] text-white/30">
                Navigera
            </p>

            <nav class="flex flex-col gap-3">

                <a href="/" class="w-fit text-[11px] text-white/70 transition-colors duration-300 hover:text-white">
                    Hem
                </a>

                <a href="/projekt" class="w-fit text-[11px] text-white/70 transition-colors duration-300 hover:text-white">
                    Projekt
                </a>

                <a href="/kontakt"
                    class="w-fit text-[11px] text-white/70 transition-colors duration-300 hover:text-white">
                    Kontakt
                </a>

            </nav>

        </div>


        <!-- CONTACT -->

        <div class="md:col-span-3">

            <p class="mb-5 text-[8px] uppercase tracking-[0.25em] text-white/30">
                Kontakt
            </p>

            <div class="flex flex-col gap-3">

                <a href="mailto:{{ company:email }}"
                    class="w-fit text-[11px] text-white/70 transition-colors duration-300 hover:text-white">
                    {{ company:email }}
                </a>

                <a href="tel:{{ company:phone_link }}"
                    class="w-fit text-[11px] text-white/70 transition-colors duration-300 hover:text-white">
                    {{ company:phone }}
                </a>

            </div>

        </div>


        <!-- SOCIAL -->

        <div class="md:col-span-2">

            <p class="mb-5 text-[8px] uppercase tracking-[0.25em] text-white/30">
                Följ
            </p>

            <div class="flex flex-col gap-3">

                <a href="{{ company:instagram ?? 'https://www.instagram.com/korta.ben/' }}" target="_blank" rel="noopener" class="w-fit text-[11px] text-white/70 transition-colors duration-300 hover:text-white">
                    Instagram
                </a>

            </div>

        </div>

    </div>


    <!-- ==================================================
         FOOTER BOTTOM
    ================================================== -->

    <div
        class="flex flex-col gap-3 pt-6 text-[7px] uppercase tracking-[0.25em] text-white/25 md:flex-row md:items-center md:justify-end">

        <p>
            © {{ now format="Y" }} Korta ben
        </p>

    </div>

</footer>
