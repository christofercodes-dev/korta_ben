</header>


<style>

/* =========================================================
   MOBILE MENU
   ========================================================= */

#mobile-menu {

    /*
     * Menyn ligger ovanför viewporten från början.
     */

    transform: translateY(-100%);

    visibility: visible;
    pointer-events: none;

    /*
     * Viktigt:
     * Vi låter transform sköta själva panelen.
     */

    transition:
        transform 900ms cubic-bezier(.76, 0, .24, 1);

}


/* =========================================================
   MENU OPEN
   ========================================================= */

#mobile-menu.is-open {

    transform: translateY(0);

    pointer-events: auto;

}


/* =========================================================
   HAMBURGER
   ========================================================= */

#menu-line-top,
#menu-line-bottom {

    transition:
        transform 600ms cubic-bezier(.16, 1, .3, 1),
        opacity 400ms ease;

}


/* TOP → X */

#menu-line-top.is-open {

    transform:
        translateY(6px)
        rotate(45deg);

}


/* BOTTOM → X */

#menu-line-bottom.is-open {

    transform:
        translateY(-6px)
        rotate(-45deg);

}


/* =========================================================
   MENU LINKS – INITIAL STATE
   ========================================================= */

.mobile-menu-link {

    opacity: 0;

    transform:
        translateY(35px);

    transition:
        opacity 650ms cubic-bezier(.16, 1, .3, 1),
        transform 750ms cubic-bezier(.16, 1, .3, 1);

}


/* =========================================================
   MENU LINKS – OPEN
   ========================================================= */

#mobile-menu.is-open .mobile-menu-link {

    opacity: 1;

    transform:
        translateY(0);

}


/* STAGGER */

#mobile-menu.is-open .mobile-menu-link:nth-child(1) {
    transition-delay: 220ms;
}

#mobile-menu.is-open .mobile-menu-link:nth-child(2) {
    transition-delay: 290ms;
}

#mobile-menu.is-open .mobile-menu-link:nth-child(3) {
    transition-delay: 360ms;
}

#mobile-menu.is-open .mobile-menu-link:nth-child(4) {
    transition-delay: 430ms;
}


/* =========================================================
   LINK TEXT
   ========================================================= */

.mobile-menu-link-text {

    transition:
        transform 600ms cubic-bezier(.16, 1, .3, 1);

}


/* Hover */

.mobile-menu-link:hover .mobile-menu-link-text {

    transform:
        translateX(8px);

}


/* =========================================================
   NUMBERS
   ========================================================= */

.mobile-menu-link-number {

    transition:
        opacity 500ms ease,
        transform 500ms cubic-bezier(.16, 1, .3, 1);

}

.mobile-menu-link:hover .mobile-menu-link-number {

    opacity: 1;

    transform:
        translateX(-4px);

}


/* =========================================================
   FOOTER
   ========================================================= */

.mobile-menu-footer {

    opacity: 0;

    transform:
        translateY(20px);

    transition:
        opacity 700ms cubic-bezier(.16, 1, .3, 1),
        transform 700ms cubic-bezier(.16, 1, .3, 1);

}


/* FOOTER OPEN */

#mobile-menu.is-open .mobile-menu-footer {

    opacity: 1;

    transform:
        translateY(0);

    transition-delay: 500ms;

}


/* =========================================================
   BODY LOCK
   ========================================================= */

body.menu-is-open {

    overflow: hidden;

}


/* =========================================================
   MOBILE CLOSE ANIMATION
   ========================================================= */

/*
 * När menyn STÄNGS:
 *
 * 1. Länkarna dras nedåt och försvinner
 * 2. Footer försvinner
 * 3. Därefter åker hela menypanelen upp
 *
 * Eftersom .is-open tas bort börjar länkarna
 * automatiskt gå tillbaka till sitt initiala state.
 */


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    #mobile-menu,
    #menu-line-top,
    #menu-line-bottom,
    .mobile-menu-link,
    .mobile-menu-footer,
    .mobile-menu-link-text,
    .mobile-menu-link-number {

        transition: none !important;

    }

}

</style>


<!-- =========================================================
     MOBILE MENU SCRIPT
     ========================================================= -->

<script>

document.addEventListener('DOMContentLoaded', function () {

    const button =
        document.getElementById('mobile-menu-button');

    const menu =
        document.getElementById('mobile-menu');

    const topLine =
        document.getElementById('menu-line-top');

    const bottomLine =
        document.getElementById('menu-line-bottom');

    const links =
        document.querySelectorAll('.mobile-menu-link');


    if (!button || !menu) {
        return;
    }


    /* =====================================================
       OPEN MENU
       ===================================================== */

    function openMenu() {

        menu.classList.add('is-open');

        button.setAttribute(
            'aria-expanded',
            'true'
        );

        button.setAttribute(
            'aria-label',
            'Stäng meny'
        );


        if (topLine) {
            topLine.classList.add('is-open');
        }

        if (bottomLine) {
            bottomLine.classList.add('is-open');
        }


        document.body.classList.add(
            'menu-is-open'
        );

    }


    /* =====================================================
       CLOSE MENU
       ===================================================== */

    function closeMenu() {

        /*
         * Ta bort open-state.
         *
         * CSS-animationen börjar då automatiskt
         * spela baklänges.
         */

        menu.classList.remove('is-open');


        button.setAttribute(
            'aria-expanded',
            'false'
        );

        button.setAttribute(
            'aria-label',
            'Öppna meny'
        );


        if (topLine) {
            topLine.classList.remove('is-open');
        }

        if (bottomLine) {
            bottomLine.classList.remove('is-open');
        }


        /*
         * Behåll body lock tills panelen nästan
         * är borta. Det gör stängningen stabilare
         * på mobil.
         */

        setTimeout(function () {

            document.body.classList.remove(
                'menu-is-open'
            );

        }, 700);

    }


    /* =====================================================
       BUTTON
       ===================================================== */

    button.addEventListener(
        'click',
        function (event) {

            event.preventDefault();

            event.stopPropagation();


            const isOpen =
                button.getAttribute(
                    'aria-expanded'
                ) === 'true';


            if (isOpen) {

                closeMenu();

            } else {

                openMenu();

            }

        }
    );


    /* =====================================================
       LINKS
       ===================================================== */

    links.forEach(function (link) {

        link.addEventListener(
            'click',
            function () {

                closeMenu();

            }
        );

    });


    /* =====================================================
       RESIZE
       ===================================================== */

    window.addEventListener(
        'resize',
        function () {

            if (window.innerWidth >= 768) {

                closeMenu();

            }

        }
    );

});

</script>
