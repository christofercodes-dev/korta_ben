
<section class="services-hero overflow-hidden bg-white px-5 pb-24 pt-20 text-[#181818] sm:px-6 md:px-8 md:pb-40 md:pt-32">

    <div class="mx-auto max-w-[1440px]">

        <!-- LABEL -->
        <div class="mb-16 grid grid-cols-1 sm:mb-20 md:mb-32 md:grid-cols-12">

            <div class="min-w-0 md:col-span-3 md:col-start-1">

                <p class="services-hero-label section-label text-black/35">
                    Tjänster
                </p>

            </div>

        </div>


        <!-- TITLE -->
        <div class="grid min-w-0 grid-cols-1 md:grid-cols-12">

            <div class="min-w-0 md:col-span-11 md:col-start-2">

                <h1 class="services-hero-title max-w-[1200px] break-words text-[clamp(3.5rem,12vw,8rem)] font-light leading-[0.86] tracking-[-0.075em]">
                    {{ title }}
                </h1>

            </div>

        </div>


        <!-- INTRO -->
        <div class="mt-16 grid min-w-0 grid-cols-1 sm:mt-20 md:mt-32 md:grid-cols-12">

            <div class="min-w-0 md:col-span-5 md:col-start-7">

                <div class="services-hero-content max-w-[600px] text-[15px] leading-[1.7] tracking-[-0.01em] text-black/55 sm:text-[16px] md:text-[18px]">
                    {{ content }}
                </div>

            </div>

        </div>

    </div>

</section>


<!-- ==================================================
     SERVICES LIST
================================================== -->

<section class="services-section overflow-hidden bg-[#181818] px-5 py-24 text-white sm:px-6 md:px-8 md:py-40">

    <div class="mx-auto max-w-[1440px]">

        <!-- HEADER -->
        <div class="grid min-w-0 grid-cols-1 gap-12 md:grid-cols-12 md:gap-10">

            <!-- LABEL -->
            <div class="min-w-0 md:col-span-3 md:col-start-1">

                <p class="services-section-label section-label text-white/35">
                    Vad vi gör
                </p>

            </div>


            <!-- TITLE -->
            <div class="min-w-0 md:col-span-8 md:col-start-5">

                <h2 class="services-section-title max-w-[850px] break-words text-[clamp(2.7rem,8vw,5.5rem)] font-medium leading-[0.9] tracking-[-0.06em]">
                    Från idé till uttryck.
                </h2>

            </div>

        </div>


        <!-- SERVICES -->
        <div class="services-list mt-20 border-t border-white/15 sm:mt-24 md:mt-40">

            {{ services }}

                <div class="service-item group min-w-0 border-b border-white/15 py-9 sm:py-10 md:py-14">

                    <div class="grid min-w-0 grid-cols-1 gap-7 md:grid-cols-12 md:items-start md:gap-8">

                        <!-- NUMBER -->
                        <div class="min-w-0 md:col-span-2 md:col-start-1">

                            <p class="text-[9px] font-medium uppercase tracking-[0.25em] text-white/30">
                                0{{ index + 1 }}
                            </p>

                        </div>


                        <!-- TITLE -->
                        <div class="min-w-0 md:col-span-5 md:col-start-3">

                            <h3 class="break-words text-[clamp(2rem,8vw,3.7rem)] font-medium leading-[0.9] tracking-[-0.055em] transition-transform duration-700 ease-[cubic-bezier(.16,1,.3,1)] md:group-hover:translate-x-2">
                                {{ title }}
                            </h3>

                        </div>


                        <!-- DESCRIPTION -->
                        <div class="min-w-0 md:col-span-4 md:col-start-9">

                            <div class="service-description max-w-[420px] text-[13px] leading-[1.7] text-white/50 sm:text-[14px] md:text-[15px]">
                                {{ description }}
                            </div>

                        </div>

                    </div>

                </div>

            {{ /services }}

        </div>

    </div>

</section>


<!-- ==================================================
     APPROACH
================================================== -->

<section class="services-section approach-section overflow-hidden bg-white px-5 py-24 text-[#181818] sm:px-6 md:px-8 md:py-48">

    <div class="mx-auto max-w-[1440px]">

        <div class="grid min-w-0 grid-cols-1 gap-14 sm:gap-16 md:grid-cols-12 md:gap-10">

            <!-- LABEL -->
            <div class="min-w-0 md:col-span-3 md:col-start-1">

                <p class="services-section-label section-label text-black/35">
                    Vårt sätt
                </p>

            </div>


            <!-- CONTENT -->
            <div class="min-w-0 md:col-span-8 md:col-start-5">

                <h2 class="services-section-title max-w-[950px] break-words text-[clamp(2.7rem,8vw,6rem)] font-medium leading-[1] tracking-[-0.06em]">
                    Bra design handlar om mer än att se bra ut.
                </h2>


                <div class="services-section-content mt-12 max-w-[600px] text-[15px] leading-[1.75] text-black/50 sm:mt-14 sm:text-[16px] md:mt-20 md:text-[17px]">
                    {{ approach_content }}
                </div>

            </div>

        </div>

    </div>

</section>


<!-- ==================================================
     CTA
================================================== -->

<section class="services-section cta-section overflow-hidden bg-[#181818] px-5 py-24 text-white sm:px-6 md:px-8 md:py-48">

    <div class="mx-auto max-w-[1440px]">

        <div class="grid min-w-0 grid-cols-1 gap-12 md:grid-cols-12 md:gap-10">

            <!-- LABEL -->
            <div class="min-w-0 md:col-span-3 md:col-start-1">

                <p class="services-section-label section-label text-white/35">
                    Kontakt
                </p>

            </div>


            <!-- CTA -->
            <div class="min-w-0 md:col-span-8 md:col-start-5">

                <h2 class="services-section-title max-w-[1000px] break-words text-[clamp(3rem,9vw,7rem)] font-medium leading-[0.87] tracking-[-0.07em]">
                    Har du något på gång?
                </h2>


                <a
                    href="/kontakt"
                    class="services-cta-link group mt-10 inline-flex min-h-[44px] items-center gap-5 py-3 text-[10px] font-medium uppercase tracking-[0.22em] sm:mt-12 sm:gap-6"
                >
                    <span>
                        Berätta mer
                    </span>

                    <span class="transition-transform duration-500 ease-[cubic-bezier(.16,1,.3,1)] group-hover:translate-x-2">
                        →
                    </span>
                </a>

            </div>

        </div>

    </div>

</section>
