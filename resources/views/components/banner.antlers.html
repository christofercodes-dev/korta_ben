{{ collection:pages slug="rullande-banner" limit="1" }}
    {{ marquee }}
        {{ if type == "banner" }}

            <section
                class="relative hidden overflow-hidden border-y border-white/10 bg-[#f5f5f7] text-[#181818] md:block"
            >
                <div
                    class="marquee"
                    data-marquee
                >
                    <div
                        class="marquee-track"
                        data-marquee-track
                    >
                        <!-- ORIGINAL -->
                        <div
                            class="marquee-content flex shrink-0 items-center"
                            data-marquee-content
                        >
                            <span class="mx-10 text-[9px] uppercase tracking-[0.28em]">
                                {{ text_1 }}
                            </span>

                            <span class="text-xs text-[#181818]/30">
                                {{ symbol }}
                            </span>

                            <span class="mx-10 font-serif text-2xl">
                                {{ text_2 }}
                            </span>

                            <span class="text-xs text-[#181818]/30">
                                {{ symbol }}
                            </span>

                            <span class="mx-10 text-[9px] uppercase tracking-[0.28em]">
                                {{ text_3 }}
                            </span>

                            <span class="text-xs text-[#181818]/30">
                                {{ symbol }}
                            </span>

                            <span class="mx-10 text-[9px] uppercase tracking-[0.28em]">
                                {{ text_4 }}
                            </span>

                            <span class="mx-10 text-xs text-[#181818]/30">
                                {{ symbol }}
                            </span>
                        </div>
                    </div>
                </div>
            </section>

        {{ /if }}
    {{ /marquee }}
{{ /collection:pages }}


<style>
    .marquee {
        width: 100%;
        overflow: hidden;
    }

    .marquee-track {
        display: flex;
        width: max-content;
        will-change: transform;
        animation: none;
    }

    .marquee-content {
        flex-shrink: 0;
    }

    .marquee-content.clone {
        margin-left: 0;
    }

    @keyframes marquee-scroll {
        from {
            transform: translate3d(0, 0, 0);
        }

        to {
            transform: translate3d(var(--marquee-distance), 0, 0);
        }
    }

    .marquee-track.is-ready {
        animation: marquee-scroll var(--marquee-duration) linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
        .marquee-track.is-ready {
            animation: none;
            transform: translate3d(0, 0, 0);
        }
    }
</style>


<script>
    (() => {
        const marquee = document.querySelector("[data-marquee]");
        const track = document.querySelector("[data-marquee-track]");
        const original = document.querySelector("[data-marquee-content]");

        if (!marquee || !track || !original) return;

        let resizeTimer;

        function setupMarquee() {
            track.classList.remove("is-ready");
            track.style.removeProperty("--marquee-distance");
            track.style.removeProperty("--marquee-duration");

            track
                .querySelectorAll(".marquee-content.clone")
                .forEach((el) => {
                    el.remove();
                });

            const width = original.getBoundingClientRect().width;

            if (!width) return;

            const viewportWidth =
                marquee.getBoundingClientRect().width;

            const copiesNeeded =
                Math.ceil(viewportWidth / width) + 2;

            for (let i = 0; i < copiesNeeded; i++) {
                const clone = original.cloneNode(true);

                clone.classList.add("clone");
                clone.setAttribute("aria-hidden", "true");

                track.appendChild(clone);
            }

            track.style.setProperty(
                "--marquee-distance",
                `-${width}px`
            );

            const speed = 70;
            const duration = width / speed;

            track.style.setProperty(
                "--marquee-duration",
                `${duration}s`
            );

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    track.classList.add("is-ready");
                });
            });
        }

        setupMarquee();

        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);

            resizeTimer = setTimeout(() => {
                setupMarquee();
            }, 150);
        });

        document.fonts?.ready.then(() => {
            setupMarquee();
        });
    })();
</script>
