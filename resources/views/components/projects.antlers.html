<section class="overflow-hidden bg-white px-5 py-20 text-black md:px-8 md:py-32">

    <div class="mx-auto grid max-w-[1440px] grid-cols-1 gap-10 md:grid-cols-2 md:gap-20">

        <!-- LABEL -->

        <div>

            <p class="text-[10px] font-semibold uppercase tracking-[0.25em] text-black/40">
                Utvalda projekt
            </p>

        </div>


        <!-- TITLE -->

        <div>

            <h2 class="max-w-[850px] text-[clamp(3rem,6vw,6.5rem)] font-medium leading-[0.92] tracking-[-0.055em]">
                Några projekt vi är stolta över.
            </h2>

        </div>

    </div>

</section>


<section class="overflow-hidden bg-white px-5 pb-24 text-[#181818] md:px-8 md:pb-40">

    <div class="grid grid-cols-1 gap-12 md:grid-cols-2 md:gap-x-3 md:gap-y-20">

        {{ featured_projects }}

        <a href="{{ url }}" class="group block min-w-0">

            <!-- IMAGE -->
            <div class="relative aspect-[1.8] overflow-hidden bg-[#e8e6e1]">

                <!-- ORIGINAL IMAGE -->
                {{ image }}
                    <img
                        src="{{ glide:url width="1600" fit="max" format="webp" quality="80" }}"
                        srcset="{{ glide:url width="800" fit="max" format="webp" quality="80" }} 800w, {{ glide:url width="1600" fit="max" format="webp" quality="80" }} 1600w, {{ glide:url width="2400" fit="max" format="webp" quality="80" }} 2400w"
                        sizes="(min-width: 768px) 50vw, 100vw"
                        alt="{{ alt ?? title }}"
                        class="absolute inset-0 h-full w-full object-cover opacity-100 transition-opacity duration-[1400ms] ease-[cubic-bezier(.16,1,.3,1)] will-change-[opacity]"
                    >
                {{ /image }}

                <!-- HOVER IMAGE -->
                {{ if image_hover }}
                    {{ image_hover }}
                        <img
                            src="{{ glide:url width="1600" fit="max" format="webp" quality="80" }}"
                            srcset="{{ glide:url width="800" fit="max" format="webp" quality="80" }} 800w, {{ glide:url width="1600" fit="max" format="webp" quality="80" }} 1600w, {{ glide:url width="2400" fit="max" format="webp" quality="80" }} 2400w"
                            sizes="(min-width: 768px) 50vw, 100vw"
                            alt=""
                            class="absolute inset-0 h-full w-full object-cover opacity-0 transition-opacity duration-[1400ms] ease-[cubic-bezier(.16,1,.3,1)] will-change-[opacity] group-hover:opacity-100"
                        >
                    {{ /image_hover }}
                {{ /if }}

            </div>

        </a>

        {{ /featured_projects }}

    </div>

    <!-- MORE PROJECTS BUTTON -->
    <div class="mt-16 flex justify-center md:mt-24"> <a href="/projekt" class="project-button group relative inline-flex items-center gap-5 overflow-hidden rounded-full border border-black/15 px-7 py-4 text-[10px] font-semibold uppercase tracking-[0.2em] text-[#181818] md:px-8 md:py-5" > <!-- LIQUID WIPE --> <span class="project-button-fill absolute inset-y-0 left-0 w-0 rounded-full transition-all duration-[850ms] ease-[cubic-bezier(.16,1,.3,1)] group-hover:w-full" ></span> <!-- TEXT --> <span class="project-button-text relative z-10 transition-colors duration-500" > Se fler projekt </span> <!-- ARROW --> <span class="project-button-arrow relative z-10 flex h-7 w-7 items-center justify-center overflow-hidden rounded-full border border-current transition-all duration-700 ease-[cubic-bezier(.16,1,.3,1)] group-hover:rotate-45" > <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-3.5 w-3.5" > <path d="M5 12h14"/> <path d="m13 6 6 6-6 6"/> </svg> </span> </a> </div>


    

</section>
