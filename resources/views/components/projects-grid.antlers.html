
<section
    class="project-hero bg-white px-5 pt-20 text-black md:px-8 md:pb-0 md:pt-32"
>

    <div class="mx-auto max-w-[1440px]">

        <div class="grid grid-cols-1 gap-10 md:grid-cols-12 md:gap-10">

            <!-- LABEL -->
            <div class="min-w-0 md:col-span-3 md:col-start-1">

                <p class="project-label section-label text-black/35">
                    Projekt
                </p>

            </div>


            <!-- TITLE -->
            <div class="min-w-0 md:col-span-8 md:col-start-8">

                <h1
                    class="project-title max-w-[850px] text-[clamp(3rem,6vw,6rem)] font-light leading-[0.92] tracking-[-0.055em]"
                >
                    Vi skapar visuella uttryck som får varumärken att synas.
                </h1>

            </div>

        </div>

    </div>

</section>


<!-- =========================================================
     PROJECT GRID
     ========================================================= -->

<section
    class="project-grid relative bg-white px-5 pb-24 text-[#181818] md:px-8 md:pb-40"
>

    <div class="mx-auto max-w-[1440px]">

        <div class="grid grid-cols-1 gap-12 md:grid-cols-2 md:gap-x-3 md:gap-y-20">

            {{ collection:projects }}

            <a
                href="{{ url }}"
                class="project-card group block min-w-0"
            >

                <!-- IMAGE -->
                <div
                    class="project-image-wrap relative aspect-[1.8] overflow-hidden bg-[#e8e6e1]"
                >

                    {{ assets:image }}

                        <img
                            src="{{ url }}"
                            alt="{{ alt ?? title }}"
                            class="project-image absolute inset-0 h-full w-full object-cover"
                        >

                    {{ /assets:image }}

                </div>


                <!-- PROJECT INFO -->
                <div
                    class="project-info flex items-center justify-between border-b border-black/10 py-5"
                >

                    <div>

                        {{ if category }}

                            <p
                                class="project-category mb-2 text-[8px] font-medium uppercase tracking-[0.25em] text-black/35"
                            >
                                {{ category }}
                            </p>

                        {{ /if }}

                        <h2
                            class="project-name text-[15px] font-medium uppercase leading-none tracking-[-0.01em] md:text-[18px]"
                        >
                            {{ title }}
                        </h2>

                    </div>

                </div>

            </a>

            {{ /collection:projects }}

        </div>

    </div>

</section>


<style>

/* =========================================================
   PROJECT HERO
   ========================================================= */

.project-hero {
    position: relative;

    background: #ffffff !important;

    border: none !important;
    border-top: none !important;
    border-right: none !important;
    border-bottom: none !important;
    border-left: none !important;

    box-shadow: none !important;
    outline: none !important;

    margin: 0 !important;
}


/* Kill every possible pseudo element */

.project-hero::before,
.project-hero::after {
    content: none !important;
    display: none !important;
}


/* =========================================================
   PROJECT GRID
   ========================================================= */

.project-grid {
    position: relative;

    background: #ffffff !important;

    border: none !important;
    border-top: none !important;
    border-bottom: none !important;

    box-shadow: none !important;
    outline: none !important;

    margin: 0 !important;
}


/* =========================================================
   HERO LABEL
   ========================================================= */

.project-label {
    opacity: 0;

    transform: translateY(20px);

    transition:
        opacity 800ms cubic-bezier(.16, 1, .3, 1),
        transform 800ms cubic-bezier(.16, 1, .3, 1);
}

.project-label.is-visible {
    opacity: 1;
    transform: translateY(0);
}


/* =========================================================
   HERO TITLE
   ========================================================= */

.project-title {
    opacity: 0;

    transform: translateY(80px);

    transition:
        opacity 1100ms cubic-bezier(.16, 1, .3, 1) 100ms,
        transform 1100ms cubic-bezier(.16, 1, .3, 1) 100ms;
}

.project-title.is-visible {
    opacity: 1;
    transform: translateY(0);
}


/* =========================================================
   PROJECT CARD
   ========================================================= */

.project-card {
    opacity: 0;

    transform: translateY(70px);

    transition:
        opacity 1000ms cubic-bezier(.16, 1, .3, 1),
        transform 1000ms cubic-bezier(.16, 1, .3, 1);
}

.project-card.is-visible {
    opacity: 1;
    transform: translateY(0);
}


/* =========================================================
   IMAGE REVEAL – DESKTOP
   ========================================================= */

.project-image-wrap {
    clip-path: inset(8% 0 8% 0);

    transition:
        clip-path 1200ms cubic-bezier(.16, 1, .3, 1);
}

.project-card.is-visible .project-image-wrap {
    clip-path: inset(0 0 0 0);
}


/* =========================================================
   IMAGE
   ========================================================= */

.project-image {
    transform: scale(1.08);

    transition:
        transform 1400ms cubic-bezier(.16, 1, .3, 1);
}

.project-card.is-visible .project-image {
    transform: scale(1);
}


/* =========================================================
   PROJECT INFO
   ========================================================= */

.project-info {
    opacity: 0;

    transform: translateY(12px);

    transition:
        opacity 700ms cubic-bezier(.16, 1, .3, 1) 250ms,
        transform 700ms cubic-bezier(.16, 1, .3, 1) 250ms;
}

.project-card.is-visible .project-info {
    opacity: 1;
    transform: translateY(0);
}


/* =========================================================
   CATEGORY
   ========================================================= */

.project-category {
    opacity: 0;

    transform: translateY(8px);

    transition:
        opacity 600ms cubic-bezier(.16, 1, .3, 1) 350ms,
        transform 600ms cubic-bezier(.16, 1, .3, 1) 350ms;
}

.project-card.is-visible .project-category {
    opacity: 1;
    transform: translateY(0);
}


/* =========================================================
   PROJECT NAME HOVER
   ========================================================= */

.project-name {
    transition:
        transform 600ms cubic-bezier(.16, 1, .3, 1);
}

.project-card:hover .project-name {
    transform: translateX(6px);
}


/* =========================================================
   IMAGE HOVER
   ========================================================= */

.project-card:hover .project-image {
    transform: scale(1.035);
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 767px) {

    /* -----------------------------------------------
       HERO
       ----------------------------------------------- */

    .project-hero {
        padding-bottom: 0 !important;

   

        margin-bottom: 0 !important;

        border-bottom: 0 !important;
    }


    /* -----------------------------------------------
       PROJECT GRID
       ----------------------------------------------- */

    .project-grid {
        margin-top: -1px !important;

        padding-top: 1px !important;

        border-top: 0 !important;
    }


    /* -----------------------------------------------
       HERO TITLE
       ----------------------------------------------- */

    .project-title {
        transform: translateY(50px);
        padding-top: 50px;
        padding-bottom: 100px;
    }


    /* -----------------------------------------------
       PROJECT CARDS
       ----------------------------------------------- */

    .project-card {
        transform: translateY(45px);
    }


    /* -----------------------------------------------
       IMPORTANT:
       NO CLIP PATH ON MOBILE
       ----------------------------------------------- */

    .project-image-wrap {
        clip-path: none !important;
    }

    .project-card.is-visible .project-image-wrap {
        clip-path: none !important;
    }


    /* -----------------------------------------------
       NO INITIAL IMAGE SCALE ON MOBILE
       ----------------------------------------------- */

    .project-image {
        transform: none !important;
        transition: none !important;
    }

    .project-card.is-visible .project-image {
        transform: none !important;
    }


    /* -----------------------------------------------
       REMOVE ALL POSSIBLE MOBILE EDGES
       ----------------------------------------------- */

    .project-hero,
    .project-grid {
        border: 0 !important;
        outline: 0 !important;
        box-shadow: none !important;
    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .project-label,
    .project-title,
    .project-card,
    .project-image-wrap,
    .project-image,
    .project-info,
    .project-category {

        opacity: 1;

        transform: none;

        clip-path: none;

        transition: none;
    }

}

</style>


<script>

(function () {

    function initProjectAnimations() {

        const label =
            document.querySelector('.project-label');

        const title =
            document.querySelector('.project-title');

        const cards =
            document.querySelectorAll('.project-card');


        /* -------------------------------------------------
           HERO LABEL
           ------------------------------------------------- */

        if (label) {

            setTimeout(function () {

                label.classList.add('is-visible');

            }, 100);

        }


        /* -------------------------------------------------
           HERO TITLE
           ------------------------------------------------- */

        if (title) {

            setTimeout(function () {

                title.classList.add('is-visible');

            }, 220);

        }


        /* -------------------------------------------------
           PROJECT CARDS
           ------------------------------------------------- */

        cards.forEach(function (card, index) {

            const delay =
                850 + (index * 130);

            setTimeout(function () {

                card.classList.add('is-visible');

            }, delay);

        });

    }


    /* -----------------------------------------------------
       INIT
       ----------------------------------------------------- */

    if (document.readyState === 'loading') {

        document.addEventListener(
            'DOMContentLoaded',
            initProjectAnimations
        );

    } else {

        initProjectAnimations();

    }

})();

</script>
