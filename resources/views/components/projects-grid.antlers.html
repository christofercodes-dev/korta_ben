
<section
    class="project-hero bg-white px-5 pt-20 text-black md:px-8 md:pb-0 md:pt-32"
>

    <div class="mx-auto max-w-[1440px]">

        <div class="grid grid-cols-1 gap-10 md:grid-cols-12 md:gap-10">

            <!-- LABEL -->
            <div class="min-w-0 md:col-span-3 md:col-start-1">

                <p class="project-label section-label text-black/35">
                    Projekt
                </p>

            </div>


            <!-- TITLE -->
            <div class="min-w-0 md:col-span-8 md:col-start-8">

                <h1
                    class="project-title max-w-[850px] text-[clamp(3rem,6vw,6rem)] font-light leading-[0.92] tracking-[-0.055em] pb-20"
                >
                    Vi skapar visuella uttryck som får varumärken att synas.
                </h1>

            </div>

        </div>

    </div>

</section>


<!-- =========================================================
     PROJECT GRID
     ========================================================= -->

<section
    class="project-grid relative bg-white px-5 pb-24 text-[#181818] md:px-8 md:pb-40"
>

    <div class="mx-auto max-w-[1440px]">

        <div class="grid grid-cols-1 gap-12 md:grid-cols-2 md:gap-x-3 md:gap-y-20">

            {{ collection:projects }}

            <a
                href="{{ url }}"
                class="project-card group block min-w-0"
            >

                <!-- IMAGE -->
                <div
                    class="project-image-wrap relative aspect-[1.8] overflow-hidden bg-[#e8e6e1]"
                >

                    {{ image }}

                        <img
                            src="{{ glide:url width="1600" fit="max" format="webp" quality="80" }}"
                            srcset="{{ glide:url width="800" fit="max" format="webp" quality="80" }} 800w, {{ glide:url width="1600" fit="max" format="webp" quality="80" }} 1600w, {{ glide:url width="2400" fit="max" format="webp" quality="80" }} 2400w"
                            sizes="(min-width: 768px) 50vw, 100vw"
                            alt="{{ alt ?? title }}"
                            class="project-image absolute inset-0 h-full w-full object-cover transition-opacity duration-[1400ms] ease-[cubic-bezier(.16,1,.3,1)] {{ if image_hover }}group-hover:opacity-0{{ /if }}"
                        >

                    {{ /image }}

                    {{ if image_hover }}
                        {{ image_hover }}

                            <img
                                src="{{ glide:url width="1600" fit="max" format="webp" quality="80" }}"
                                srcset="{{ glide:url width="800" fit="max" format="webp" quality="80" }} 800w, {{ glide:url width="1600" fit="max" format="webp" quality="80" }} 1600w, {{ glide:url width="2400" fit="max" format="webp" quality="80" }} 2400w"
                                sizes="(min-width: 768px) 50vw, 100vw"
                                alt=""
                                class="absolute inset-0 h-full w-full object-cover opacity-0 transition-opacity duration-[1400ms] ease-[cubic-bezier(.16,1,.3,1)] group-hover:opacity-100"
                            >

                        {{ /image_hover }}
                    {{ /if }}

                </div>


                <!-- PROJECT INFO -->
                <div
                    class="project-info flex items-center justify-between border-b border-black/10 py-5"
                >

                    <div>

                        {{ if category }}

                            <p
                                class="project-category mb-2 text-[8px] font-medium uppercase tracking-[0.25em] text-black/35"
                            >
                                {{ category:label }}
                            </p>

                        {{ /if }}

                        <h2
                            class="project-name text-[15px] font-medium uppercase leading-none tracking-[-0.01em] md:text-[18px]"
                        >
                            {{ title }}
                        </h2>

                    </div>

                </div>

            </a>

            {{ /collection:projects }}

        </div>

    </div>

</section>
