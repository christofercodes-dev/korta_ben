<!doctype html>
<html lang="{{ site:short_locale }}">

<head>
    <script>
        (function () {
            try {
                if (
                    sessionStorage.getItem('menu-navigation') === 'true'
                ) {
                    document.documentElement.classList.add(
                        'menu-transition-page'
                    );
                }
            } catch (e) {}
        })();
        </script>
        
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {{ partial:components/seo }}

    {{ vite src="resources/js/site.js|resources/css/site.css" }}
    <!-- Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    {{ cookie_consent:defaults }}

    {{ if config:seo:indexable && config:seo:fathom_site_id }}
        <!-- Fathom Analytics -->
        <script src="https://cdn.usefathom.com/script.js" data-site="{{ config:seo:fathom_site_id }}" defer></script>
    {{ /if }}

    <!-- Support -->
    <script src="https://support.kortaben.se/api/public/widget.js" async></script>
</head>

<body class="antialiased bg-zinc-100 font-sans leading-normal text-zinc-800 dark:bg-zinc-900 dark:text-zinc-400">

    {{ template_content }}

    {{ cookie_consent }}
    {{ cookie_consent:button }}
    {{ cookie_consent:scripts }}

</body>

</html>
