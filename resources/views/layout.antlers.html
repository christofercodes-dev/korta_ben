<!doctype html>
<html lang="{{ site:short_locale }}">

<head>
    <script>
        (function () {
            try {
                if (
                    sessionStorage.getItem('menu-navigation') === 'true'
                ) {
                    document.documentElement.classList.add(
                        'menu-transition-page'
                    );
                }
            } catch (e) {}
        })();
        </script>
        
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ (title ?? site:name) | sanitize }}</title>

    {{ vite src="resources/js/site.js|resources/css/site.css" }}

    <!-- Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>

<body class="antialiased bg-zinc-100 font-sans leading-normal text-zinc-800 dark:bg-zinc-900 dark:text-zinc-400">

    {{ template_content }}

</body>

</html>
