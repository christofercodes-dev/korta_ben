<!doctype html>
<html lang="{{ site:short_locale }}">

<head>
    <script>
        (function () {
            try {
                if (
                    sessionStorage.getItem('menu-navigation') === 'true'
                ) {
                    document.documentElement.classList.add(
                        'menu-transition-page'
                    );
                }
            } catch (e) {}
        })();
        </script>
        
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ (title ?? site:name) | sanitize }}</title>
    {{ if description }}<meta name="description" content="{{ description | truncate:160 | sanitize }}">{{ /if }}

    {{ vite src="resources/js/site.js|resources/css/site.css" }}
    <!-- Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body class="antialiased bg-zinc-100 font-sans leading-normal text-zinc-800 dark:bg-zinc-900 dark:text-zinc-400">

    {{ template_content }}

</body>

</html>
